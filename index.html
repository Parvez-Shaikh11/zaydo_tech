<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/photos/mark-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070E" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://zaydotech.com/" />

    <!-- SEO -->
    <title>Zaydo Tech — Custom Software, Automation & Digital Systems</title>
    <meta name="description" content="Zaydo Tech engineers custom software, scalable web applications, workflow automation and practical AI systems that turn complex business challenges into reliable digital systems." />
    <meta name="keywords" content="Zaydo Tech, custom software development, web application development, workflow automation, AI integration, business systems, digital platforms" />
    <meta name="author" content="Zaydo Tech" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Zaydo Tech — Custom Software, Automation & Digital Systems" />
    <meta property="og:description" content="We design and build custom software, web applications and intelligent automation that help businesses operate smarter and scale." />
    <meta property="og:image" content="https://zaydotech.com/photos/logo-dark.png" />
    <meta property="og:url" content="https://zaydotech.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zaydo Tech — Custom Software, Automation & Digital Systems" />
    <meta name="twitter:description" content="We design and build custom software, web applications and intelligent automation that help businesses operate smarter and scale." />
    <meta name="twitter:image" content="https://zaydotech.com/photos/logo-dark.png" />

    <!-- Structured Data (JSON-LD) for SEO 100 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Zaydo Tech",
      "url": "https://zaydotech.com/",
      "logo": "https://zaydotech.com/photos/logo-dark.png",
      "description": "Zaydo Tech designs and builds custom software, scalable web applications and intelligent automation.",
      "sameAs": [
        "https://www.linkedin.com/company/zaydotech",
        "https://www.instagram.com/zaydotech",
        "https://www.youtube.com/channel/UCwouefMhxdHF0PvNm67-dzw"
      ]
    }
    </script>

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>

    <!-- Preload LCP hero image -->
    <link rel="preload" fetchpriority="high" as="image" href="/photos/team-hero.webp" type="image/webp">

    <!-- Resolve the theme before first paint so the page never flashes the wrong palette. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zaydo-theme');
          var theme = stored || 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
